name: Update data and publish site

on:
  push:
    branches: [main]
  schedule:
    # every hour, so injury news, lines, and stats stay fresh even if nobody opens the page
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build data
        run: python scripts/build_data.py
      - name: Backtest
        # The backtest only feeds the calibration curves. If it breaks, keep the published curves
        # so fresh lines and stats still go out, and flag the run with a warning.
        run: |
          python scripts/backtest.py "$(python -c 'import datetime as d; t=d.date.today(); print(t.year if t.month >= 8 else t.year - 1)')" || {
            echo "::warning::Backtest failed; reusing the published backtest.json"
            curl -sfL -o site/data/backtest.json "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/backtest.json" || true
          }
      - name: Build NBA data
        # If the NBA download fails, keep the NBA numbers already on the live site so the NFL page still publishes.
        run: |
          python scripts/nba_build.py || {
            echo "NBA build failed; reusing the published NBA data"
            curl -sfL -o site/data/nba.json "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/nba.json" || true
            curl -sfL -o site/data/nba_backtest.json "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/nba_backtest.json" || true
          }
      - name: Collect player news
        # Injury, illness, rest, role, trade, and morale stories from free feeds, kept for 7 days by
        # merging with the published copy. Optional: if it fails, the site publishes without fresh news.
        run: |
          curl -sfL -o site/data/news.json "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/news.json" || true
          python scripts/news_build.py || echo "::warning::News collection failed; publishing without fresh news"
      - name: Stamp script and style links with this commit
        # so a browser holding yesterday's copy of a script loads the new one after each deploy
        run: sed -i -E "s/(src=\"[a-z]+\.js|href=\"style\.css)\"/\1?v=${GITHUB_SHA::8}\"/g" site/*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
