name: News feed probe (temporary)
on:
  push:
    branches: ["claude/**"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Use the published data files for player names
        run: |
          mkdir -p site/data
          curl -sfL -o site/data/data.json "https://werdna1976.github.io/nfl-matchup-tool/data/data.json"
          curl -sfL -o site/data/nba.json "https://werdna1976.github.io/nfl-matchup-tool/data/nba.json"
      - run: python scripts/news_build.py
      - name: Sample of what matched
        run: |
          python - <<'PY'
          import json
          d = json.load(open("site/data/news.json"))
          for sport in ("nfl", "nba"):
              P = d[sport]["players"]; T = d[sport]["teams"]
              tags = {}
              for items in P.values():
                  for it in items:
                      for t in it.get("g", []) or ["none"]:
                          tags[t] = tags.get(t, 0) + 1
              print(sport, "players with news:", len(P), "teams:", len(T), "tags:", tags)
              for pid, items in sorted(P.items(), key=lambda kv: -len([i for i in kv[1] if i.get("g")]))[:25]:
                  for it in items[:2]:
                      print("  ", pid, it["s"], it.get("g"), it["h"][:110])
              for ab, items in list(T.items())[:6]:
                  print("  TEAM", ab, items[0]["s"], items[0].get("g"), items[0]["h"][:110])
          PY
