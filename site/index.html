<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NFL Matchup Lab</title>
  <meta name="description" content="This week's NFL games, betting lines, player stat trends, matchup strength, and projected ranges for prop bets.">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){document.documentElement.dataset.theme="light"}</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <nav class="sport" aria-label="Sport"><a href="index.html" aria-current="page">NFL</a><a href="nba.html">NBA</a></nav>
    <div class="brand">
      <h1>NFL Matchup Lab</h1>
      <span id="meta" class="muted"></span>
    </div>
    <nav id="weeks" class="weeks"></nav>
    <button id="propsBtn" class="btn props-btn" type="button" title="Lock of the week plus the best underpriced Polymarket props across today's and tomorrow's games">🔒 Best bets</button>
    <button id="refreshBtn" class="btn" type="button" title="Reload stats and pull the latest betting lines">Refresh</button>
    <button id="slipBtn" class="slip-btn" type="button">Parlay slip <span id="slipCount">0</span></button>
    <button id="themeBtn" class="theme-btn" type="button"></button>
  </header>

  <main>
    <section id="games" class="games" aria-label="Games"></section>
    <section id="game" class="game"></section>
  </main>

  <aside id="slip" class="drawer" aria-label="Parlay slip" hidden></aside>
  <div id="modal" class="modal" hidden><div class="modal-card" role="dialog" aria-modal="true"></div></div>

  <footer class="foot muted">
    Data: <a href="https://github.com/nflverse">nflverse</a> stats and consensus lines, live lines from ESPN, prop prices from <a href="https://polymarket.com">Polymarket</a>.
    Projections are estimates, not guarantees. <a href="#" id="howLink">How the model works</a>
  </footer>
  <script src="nav.js"></script>
  <script src="notes.js"></script>
  <script src="result.js"></script>
  <script src="steps.js"></script>
  <script src="roles.js"></script>
  <script src="vet.js"></script>
  <script src="baskets.js"></script>
  <script src="locks.js"></script>
  <script src="allprops.js"></script>
  <script src="app.js"></script>
</body>
</html>
